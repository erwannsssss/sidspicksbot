name: Picks agent

on:
  schedule:
    - cron: "0 0,12,15,18,21 * * *"   # 8am, 11am, 2pm, 5pm, 8pm Eastern (summer time)
    - cron: "0 13 * * 1"              # Monday 9am Eastern: weekly report
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal run, weekly = weekly report"
        type: choice
        options: [run, weekly]
        default: run

permissions:
  contents: write

concurrency:
  group: picks-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE=run
          if [ "${{ github.event.schedule }}" = "0 13 * * 1" ] || [ "${{ inputs.mode }}" = "weekly" ]; then MODE=weekly; fi
          python agent.py $MODE

      - name: Save results
        run: |
          git config user.name "picks-agent"
          git config user.email "picks-agent@users.noreply.github.com"
          git add -A
          git commit -m "Agent update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to save"
          git pull --rebase
          git push
