name: Picks agent

on:
  schedule:
    # Every hour from 8am to 3am Eastern (times are in UTC; shifts an hour earlier in winter).
    # The weekly report runs automatically on the first run after 9am Eastern each Monday.
    - cron: "5 0-7,12-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = normal run, ask = reply even with no new picks, weekly = weekly report"
        type: choice
        options: [run, ask, weekly]
        default: run

permissions:
  contents: write

concurrency:
  group: picks-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
       run: python -u agent.py ${{ inputs.mode || 'run' }}

      - name: Save results
        run: |
          git config user.name "picks-agent"
          git config user.email "picks-agent@users.noreply.github.com"
          git add -A
          git commit -m "Agent update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to save"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
